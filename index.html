    <style>
      /* Telugu Font Styling */
      [data-lang="te"] {
        font-family: 'Noto Serif Telugu', 'Nirmala UI', Gautami, 'Cormorant Garamond', serif;
      }
      [data-lang="te"] .font-serif,
      [data-lang="te"] .hero-bible-verse,
      [data-lang="te"] h3 {
        font-family: 'Noto Serif Telugu', 'Nirmala UI', Gautami, serif !important;
      }

      /* Fixed Language Toggle Button (Top-Right) */
      #langToggleBtn {
        position: fixed;
        top: max(16px, env(safe-area-inset-top, 16px));
        right: 16px;
        z-index: 75;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(255, 253, 248, 0.94);
        border: 1.5px solid #c49752;
        color: #46392c;
        padding: 6px 14px;
        border-radius: 9999px;
        font-family: 'Jost', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        box-shadow: 0 4px 16px rgba(70, 57, 44, 0.14), 0 0 10px rgba(196, 151, 82, 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #langToggleBtn:hover {
        transform: scale(1.05);
        background: #fffdf8;
        box-shadow: 0 6px 20px rgba(70, 57, 44, 0.2), 0 0 14px rgba(196, 151, 82, 0.4);
      }
      #langToggleBtn:active {
        transform: scale(0.95);
      }
      #langToggleBtn .lang-globe-icon {
        font-size: 0.95rem;
        line-height: 1;
      }

      /* Bottom Language Toggle Pill (Footer) */
      .bottom-lang-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin: 14px auto 6px;
        padding: 8px 20px;
        background: rgba(255, 253, 248, 0.94);
        border: 1.5px solid #c49752;
        color: #46392c;
        border-radius: 9999px;
        font-family: 'Jost', 'Noto Serif Telugu', sans-serif;
        font-size: 0.74rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(70, 57, 44, 0.1), 0 0 8px rgba(196, 151, 82, 0.18);
        transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
        -webkit-tap-highlight-color: transparent;
      }
      .bottom-lang-pill:hover {
        transform: scale(1.04);
        background: #fffdf8;
        box-shadow: 0 6px 18px rgba(70, 57, 44, 0.15), 0 0 12px rgba(196, 151, 82, 0.3);
      }
      .bottom-lang-pill:active {
        transform: scale(0.96);
      }

      /* Floating Music Button */
      #bgmAudioBtn {
        position: fixed;
        bottom: max(20px, env(safe-area-inset-bottom, 20px));
        right: 20px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 253, 248, 0.94);
        border: 1.5px solid #c49752;
        box-shadow: 0 4px 18px rgba(70, 57, 44, 0.16), 0 0 12px rgba(196, 151, 82, 0.28);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        z-index: 60;
        transition: transform 0.25s ease, box-shadow 0.25s ease, background-color 0.25s ease;
        -webkit-tap-highlight-color: transparent;
      }
      #bgmAudioBtn:hover {
        transform: scale(1.08);
        box-shadow: 0 6px 22px rgba(70, 57, 44, 0.22), 0 0 16px rgba(196, 151, 82, 0.45);
      }
      #bgmAudioBtn:active {
        transform: scale(0.92);
      }
      #bgmAudioBtn svg {
        width: 22px;
        height: 22px;
        fill: #b4864c;
      }
      #bgmAudioBtn.bgm-playing #bgmIconPlay {
        animation: bgmDiskSpin 6s linear infinite;
      }
      @keyframes bgmDiskSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Story & timeline card multi-line text */
      .photo-frame p {
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Fixed Top-Right Language Toggle Button -->
    <button
      id="langToggleBtn"
      type="button"
      aria-label="Toggle language"
    >
      <span class="lang-globe-icon" aria-hidden="true">🌐</span>
      <span id="langBtnText">తెలుగు</span>
    </button>

    <!-- Background Music Audio -->
    <audio id="weddingBgAudio" loop preload="auto" playsinline>
      <source src="./editable/assets/bgm.mp3" type="audio/mpeg" />
    </audio>

    <!-- Floating Audio Toggle Button -->
    <button
      id="bgmAudioBtn"
      type="button"
      aria-label="Play background music"
      aria-pressed="false"
      title="Toggle background music"
    >
      <svg id="bgmIconPlay" style="display:none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
      </svg>
      <svg id="bgmIconMuted" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M4.27 3L3 4.27l9 9v.28c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4v-1.73l4.73 4.73c-.45.34-.98.59-1.57.73l.63 1.9c.89-.22 1.7-.62 2.39-1.15L19.73 21 21 19.73 4.27 3zM14 7h4V3h-6v5.18l2 2V7z"/>
      </svg>
    </button>

    <!-- Language & Audio Script -->
    <script>
      (function () {
        var isTelugu = window.CURRENT_INVITATION_LANG === "te";
        document.documentElement.setAttribute("data-lang", isTelugu ? "te" : "en");

        // Set initial Top Button text
        var topBtnText = document.getElementById("langBtnText");
        var topBtn = document.getElementById("langToggleBtn");
        if (topBtnText && topBtn) {
          topBtnText.textContent = isTelugu ? "English" : "తెలుగు";
          topBtn.title = isTelugu ? "Switch to English" : "Translate into Telugu";
          topBtn.setAttribute("aria-label", isTelugu ? "Switch to English" : "Translate to Telugu");
        }

        // Toggle Language Handler
        window.toggleInvitationLanguage = function () {
          var nextLang = isTelugu ? "en" : "te";
          try {
            localStorage.setItem("supriya_sarath_lang", nextLang);

            // Remember audio playing state
            var audio = document.getElementById("weddingBgAudio");
            if (audio && !audio.paused) {
              sessionStorage.setItem("bgm_should_play", "true");
            } else {
              sessionStorage.setItem("bgm_should_play", "false");
            }
          } catch (e) {}

          var url = new URL(window.location.href);
          if (nextLang === "te") {
            url.searchParams.set("lang", "te");
          } else {
            url.searchParams.delete("lang");
          }
          window.location.replace(url.toString());
        };

        if (topBtn) {
          topBtn.addEventListener("click", window.toggleInvitationLanguage);
        }

        // Inject Bottom Language Toggle Button into Footer
        function injectBottomLangButton() {
          var footerDiv = document.querySelector("footer .relative.z-10");
          if (footerDiv && !document.getElementById("bottomLangToggleBtn")) {
            var container = document.createElement("div");
            container.className = "mt-4 mb-2";
            container.innerHTML =
              '<button id="bottomLangToggleBtn" type="button" class="bottom-lang-pill"><span aria-hidden="true">🌐</span> <span id="bottomLangBtnText">' +
              (isTelugu
                ? "English లో చూడండి (Switch to English)"
                : "తెలుగులో చదవండి (Read in Telugu)") +
              "</span></button>";
            footerDiv.appendChild(container);

            document
              .getElementById("bottomLangToggleBtn")
              .addEventListener("click", window.toggleInvitationLanguage);
          }
        }

        window.addEventListener("DOMContentLoaded", function () {
          setTimeout(injectBottomLangButton, 350);
          setTimeout(injectBottomLangButton, 1200);
        });
      })();
    </script>

    <!-- Background Music Audio Controller -->
    <script>
      (function () {
        var audio = document.getElementById("weddingBgAudio");
        var btn = document.getElementById("bgmAudioBtn");
        var iconPlay = document.getElementById("bgmIconPlay");
        var iconMuted = document.getElementById("bgmIconMuted");
        var hasUserInteracted = false;

        if (!audio || !btn) return;

        var bgmConfig = (window.WEDDING_DATA && window.WEDDING_DATA.bgm) || {};
        if (bgmConfig.src) {
          audio.src = bgmConfig.src;
        }
        if (typeof bgmConfig.volume === "number" && bgmConfig.volume >= 0 && bgmConfig.volume <= 1) {
          audio.volume = bgmConfig.volume;
        } else {
          audio.volume = 0.7;
        }
        if (bgmConfig.title) {
          btn.title = "Background music: " + bgmConfig.title;
        }

        function updateUI(isPlaying) {
          iconPlay.style.display = isPlaying ? "block" : "none";
          iconMuted.style.display = isPlaying ? "none" : "block";
          btn.classList.toggle("bgm-playing", isPlaying);
          btn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
          btn.setAttribute("aria-label", isPlaying ? "Pause background music" : "Play background music");
        }

        function playMusic() {
          audio.muted = false;
          var promise = audio.play();
          if (promise !== undefined) {
            promise
              .then(function () {
                updateUI(true);
              })
              .catch(function () {
                updateUI(false);
              });
          } else {
            updateUI(!audio.paused);
          }
        }

        function pauseMusic() {
          audio.pause();
          updateUI(false);
        }

        function cleanupUnlockListeners() {
          window.removeEventListener("click", unlockAudio, true);
          window.removeEventListener("touchstart", unlockAudio, true);
          window.removeEventListener("scroll", unlockAudio, true);
          window.removeEventListener("keydown", unlockAudio, true);
        }

        function unlockAudio(e) {
          if (hasUserInteracted) return;
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (e && e.target && (btn.contains(e.target) || (document.getElementById("langToggleBtn") && document.getElementById("langToggleBtn").contains(e.target)))) {
            return;
          }
          if (audio.paused) {
            playMusic();
          }
        }

        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (audio.paused) {
            playMusic();
          } else {
            pauseMusic();
          }
        });

        audio.addEventListener("play", function () {
          updateUI(true);
        });
        audio.addEventListener("pause", function () {
          updateUI(false);
        });

        window.addEventListener("click", unlockAudio, true);
        window.addEventListener("touchstart", unlockAudio, true);
        window.addEventListener("scroll", unlockAudio, true);
        window.addEventListener("keydown", unlockAudio, true);

        // Resume audio if it was playing before language switch
        try {
          var shouldResume = sessionStorage.getItem("bgm_should_play");
          if (shouldResume === "true") {
            playMusic();
          } else {
            playMusic();
          }
        } catch(e) {
          playMusic();
        }
      })();
    </script>
  </body>
