        var currentLang = "en";
        var isTranslating = false;

        function translateNode(node, toLang) {
          if (node.nodeType === Node.TEXT_NODE) {
            var text = node.nodeValue;
            if (!text || !text.trim()) return;

            // Direct match
            for (var i = 0; i < PHRASE_PAIRS.length; i++) {
              var pair = PHRASE_PAIRS[i];
              var fromStr = toLang === "te" ? pair[0] : pair[1];
              var toStr = toLang === "te" ? pair[1] : pair[0];

              if (text.trim() === fromStr) {
                node.nodeValue = text.replace(fromStr, toStr);
                return;
              }
            }

            // Substring replacement
            for (var j = 0; j < PHRASE_PAIRS.length; j++) {
              var p = PHRASE_PAIRS[j];
              var f = toLang === "te" ? p[0] : p[1];
              var t = toLang === "te" ? p[1] : p[0];
              if (text.indexOf(f) !== -1) {
                text = text.split(f).join(t);
              }
            }
            node.nodeValue = text;
          } else if (node.nodeType === Node.ELEMENT_NODE) {
            if (
              node.tagName === "SCRIPT" ||
              node.tagName === "STYLE" ||
              node.tagName === "AUDIO" ||
              node.id === "langToggleBtn" ||
              node.id === "bottomLangToggleBtn"
            ) {
              return;
            }
            for (var k = 0; k < node.childNodes.length; k++) {
              translateNode(node.childNodes[k], toLang);
            }
          }
        }

        function setLanguage(lang) {
          isTranslating = true;
          currentLang = lang;
          document.documentElement.setAttribute("data-lang", lang);

          var root = document.getElementById("root");
          if (root) {
            translateNode(root, lang);
          }

          var topBtnText = document.getElementById("langBtnText");
          var topBtn = document.getElementById("langToggleBtn");
          var bottomBtnText = document.getElementById("bottomLangBtnText");

          if (lang === "te") {
            if (topBtnText) topBtnText.textContent = "English";
            if (topBtn) {
              topBtn.title = "Switch back to English";
              topBtn.setAttribute("aria-label", "Switch to English");
            }
            if (bottomBtnText) bottomBtnText.textContent = "English లో చదవండి (Switch to English)";
          } else {
            if (topBtnText) topBtnText.textContent = "తెలుగు";
            if (topBtn) {
              topBtn.title = "Translate into Telugu";
              topBtn.setAttribute("aria-label", "Translate to Telugu");
            }
            if (bottomBtnText) bottomBtnText.textContent = "తెలుగులో చదవండి (Read in Telugu)";
          }

          try {
            localStorage.setItem("supriya_sarath_lang", lang);
          } catch (e) {}

          setTimeout(function () {
            isTranslating = false;
          }, 60);
        }

        // Attach Top Toggle Button Click
        var topBtn = document.getElementById("langToggleBtn");
        if (topBtn) {
          topBtn.addEventListener("click", function () {
            setLanguage(currentLang === "en" ? "te" : "en");
          });
        }

        // Dynamic Bottom Toggle Injection into Footer
        function injectBottomLangButton() {
          var footerDiv = document.querySelector("footer .relative.z-10");
          if (footerDiv && !document.getElementById("bottomLangToggleBtn")) {
            var container = document.createElement("div");
            container.className = "mt-4 mb-2";
            container.innerHTML =
              '<button id="bottomLangToggleBtn" type="button" class="bottom-lang-pill"><span aria-hidden="true">🌐</span> <span id="bottomLangBtnText">' +
              (currentLang === "te"
                ? "English లో చదవండి (Switch to English)"
                : "తెలుగులో చదవండి (Read in Telugu)") +
              "</span></button>";
            footerDiv.appendChild(container);

            document
              .getElementById("bottomLangToggleBtn")
              .addEventListener("click", function () {
                setLanguage(currentLang === "en" ? "te" : "en");
              });
          }
        }

        // Mutation Observer for dynamic elements (Countdown seconds, React re-renders)
        var observer = new MutationObserver(function (mutations) {
          if (isTranslating || currentLang !== "te") return;
          for (var m = 0; m < mutations.length; m++) {
            var mutation = mutations[m];
            if (mutation.type === "childList") {
              for (var a = 0; a < mutation.addedNodes.length; a++) {
                translateNode(mutation.addedNodes[a], "te");
              }
            } else if (mutation.type === "characterData") {
              translateNode(mutation.target, "te");
            }
          }
        });

        // Initialize on load
        window.addEventListener("DOMContentLoaded", function () {
          var rootEl = document.getElementById("root");
          if (rootEl) {
            observer.observe(rootEl, { childList: true, subtree: true, characterData: true });
          }

          // Check URL query parameter or localStorage
          var urlParams = new URLSearchParams(window.location.search);
          var savedLang = urlParams.get("lang") || (function () {
            try { return localStorage.getItem("supriya_sarath_lang"); } catch (e) { return null; }
          })();

          // Wait slightly for React to mount, then check language and inject bottom button
          setTimeout(function () {
            injectBottomLangButton();
            if (savedLang === "te") {
              setLanguage("te");
            }
          }, 350);

          // Retry bottom injection after 1.2s to ensure React root is fully rendered
          setTimeout(injectBottomLangButton, 1200);
        });

        // Expose global controller
        window.setInvitationLanguage = setLanguage;
      })();
    </script>

    <!-- Background Music Audio Controller -->
    <script>
      (function () {
        var audio = document.getElementById("weddingBgAudio");
        var btn = document.getElementById("bgmAudioBtn");
        var iconPlay = document.getElementById("bgmIconPlay");
        var iconMuted = document.getElementById("bgmIconMuted");
        var hasUserInteracted = false;

        if (!audio || !btn) return;

        var bgmConfig = (window.WEDDING_DATA && window.WEDDING_DATA.bgm) || {};
        if (bgmConfig.src) {
          audio.src = bgmConfig.src;
        }
        if (typeof bgmConfig.volume === "number" && bgmConfig.volume >= 0 && bgmConfig.volume <= 1) {
          audio.volume = bgmConfig.volume;
        } else {
          audio.volume = 0.7;
        }
        if (bgmConfig.title) {
          btn.title = "Background music: " + bgmConfig.title;
        }

        function updateUI(isPlaying) {
          iconPlay.style.display = isPlaying ? "block" : "none";
          iconMuted.style.display = isPlaying ? "none" : "block";
          btn.classList.toggle("bgm-playing", isPlaying);
          btn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
          btn.setAttribute("aria-label", isPlaying ? "Pause background music" : "Play background music");
        }

        function playMusic() {
          audio.muted = false;
          var promise = audio.play();
          if (promise !== undefined) {
            promise
              .then(function () {
                updateUI(true);
              })
              .catch(function () {
                updateUI(false);
              });
          } else {
            updateUI(!audio.paused);
          }
        }

        function pauseMusic() {
          audio.pause();
          updateUI(false);
        }

        function cleanupUnlockListeners() {
          window.removeEventListener("click", unlockAudio, true);
          window.removeEventListener("touchstart", unlockAudio, true);
          window.removeEventListener("scroll", unlockAudio, true);
          window.removeEventListener("keydown", unlockAudio, true);
        }

        function unlockAudio(e) {
          if (hasUserInteracted) return;
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (e && e.target && btn.contains(e.target)) {
            return;
          }
          if (audio.paused) {
            playMusic();
          }
        }

        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          hasUserInteracted = true;
          cleanupUnlockListeners();
          if (audio.paused) {
            playMusic();
          } else {
            pauseMusic();
          }
        });

        audio.addEventListener("play", function () {
          updateUI(true);
        });
        audio.addEventListener("pause", function () {
          updateUI(false);
        });

        window.addEventListener("click", unlockAudio, true);
        window.addEventListener("touchstart", unlockAudio, true);
        window.addEventListener("scroll", unlockAudio, true);
        window.addEventListener("keydown", unlockAudio, true);

        // Attempt initial autoplay
        playMusic();
      })();
    </script>
  </body>
</html>
